services:
  ironlog:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      NODE_ENV: production
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to your HTTPS website origin}
    volumes:
      - ironlog-data:/app/data
volumes:
  ironlog-data:
